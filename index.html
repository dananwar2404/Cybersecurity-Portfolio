<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Daniyal Anwar's cybersecurity portfolio featuring AI security, incident response, malware analysis, digital forensics, threat intelligence, and vulnerability assessment projects."
  >

  <title>Daniyal Anwar | Cybersecurity Portfolio</title>
<link
  rel="stylesheet"
  href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css"
>

<link
  rel="stylesheet"
  href="custom.css"

  <style>
    :root {
      --theme-color: #58a6ff;
    }

    .markdown-section {
      max-width: 1050px;
    }

    .markdown-section h1,
    .markdown-section h2 {
      font-weight: 700;
    }

    .sidebar {
      font-size: 15px;
    }

    .app-name-link {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div id="app">Loading portfolio...</div>

  <script>
  window.$docsify = {
  name: 'Daniyal Anwar',
  repo: 'dananwar2404/Cybersecurity-Portfolio',

  homepage: 'README.md',
  loadSidebar: '_sidebar.md',

  autoHeader: false,
  subMaxLevel: 0,
  maxLevel: 3,

  search: {
    placeholder: 'Search portfolio',
    noData: 'No results found',
    depth: 4
  },

  copyCode: {
    buttonText: 'Copy',
    errorText: 'Error',
    successText: 'Copied'
  }
};
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
